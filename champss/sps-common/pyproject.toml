[tool.poetry]
name = "sps-common"
version = "1.1.0"
description = "CHIME SPS Common Code"
authors = ["CHIME SPS <chime_spawg@physics.mcgill.>"]
license = "MIT"
readme = "README.md"
exclude = [
    "tests"
]
# The numba warm-up manifest (sps_common.numba_warmup), read from the installed package
include = ["sps_common/numba_signatures.json"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
astropy = "~6.1"
attrs = "^22.2.0"
h5py = ">=3.10,<3.16"
hdf5plugin = ">=4.0"
zstandard = ">=0.22"
numba = ">=0.59,<0.61"
matplotlib = "^3.7.1"
pytz = "^2023.3"
scipy = "^1.10.1"
threadpoolctl = "^3.1.0"
click = "^8.1.4"
easydict = "^1.11"
numpy = "^1.24.3"
pyyaml = "^6.0"
cfbm = {git = "https://github.com/chime-sps/chime-frb-beam-model"}

[tool.poetry.group.dev.dependencies]
commitizen = "^3.4.0"
mypy = "^1.4.0"
pre-commit = "^3.3.3"
pytest = "^7.3.2"

[tool.poetry.scripts]
plot_candidates = "sps_common.interfaces.single_pointing:plot_candidates"
print_candidates = "sps_common.interfaces.single_pointing:print_candidates"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
