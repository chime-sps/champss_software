[tool.poetry]
name = "rfi-mitigation"
version = "0.1.0"
description = "CHIME SPS RFI Mitigation"
authors = ["CHIME SPS <chime_spawg@physics.mcgill.>"]
license = "MIT"
readme = "README.md"
exclude = [
    "tests"
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
spshuff = {path = "../spshuff", develop=true}
sps-common = {path = "../sps-common", develop=true}
astropy = "~6.1"
h5py = ">=3.10,<3.16"
jplephem = "^2.18"
matplotlib = "^3.7.1"
numba = ">=0.59,<0.61"
numpy = "^1.24.3"
pyfftw = "^0.14"
pyyaml = "^6.0"
scipy = "^1.10.1"
tqdm = "^4.66.5"

[tool.poetry.group.dev.dependencies]
commitizen = "^3.4.0"
mypy = "^1.4.0"
pre-commit = "^3.3.3"
pytest = "^7.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
create-birdie-report = "rfi_mitigation.utilities.create_birdie_report:main"