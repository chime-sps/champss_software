name: Image

on:
 workflow_call:
    inputs:
      image_name:
        type: string
        default: 'champss_software'
      image_tag:
        type: string
      build_locally:
        type: boolean
      runs_on:
        type: string
        # The image's native code (spshuff, dmtlib) and numba cache are built for this
        # runner's CPU: run it on the kind of node the image is for. sps-compute[4-7]
        # (DDR5) have a different CPU from sps-compute[1-3]; an image built on one runs
        # suboptimally, or not at all, on the other. The default builds for 4-7, the
        # nodes that matter most. (Not a BeeGFS server: their TCP settings break
        # Internet downloads.)
        default: 'sps-compute4'
      march:
        type: string
        # -march for the native code: 'native' (the runner's CPU) or an explicit target
        # (see the Dockerfile's MARCH)
        default: 'native'

jobs:
  build-image-and-push-to-remote:
    # NEEDS to run on self-hosted GitHub runners because spshuff requires AVX2
    # supported CPUs for the image to build
    if: ${{ inputs.build_locally == false }}
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - uses: webfactory/ssh-agent@v0.4.1
        id: set-ssh
        with:
          ssh-private-key: ${{ secrets.SPS_SSH_ID }}
      # - uses: docker/setup-buildx-action@v1
      #   with:
      #     install: true
      #     config-inline: |
      #       [registry."sps-archiver1.chime:5000"]
      #         http = true
      #         insecure = true
      #       [registry."docker.io"]
      #         http = false
      - uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: |
            sps-archiver1.chime:5000/${{ inputs.image_name }}:${{ inputs.image_tag }}
            docker.io/chimefrb/${{ inputs.image_name }}:${{ inputs.image_tag }}
          ssh: "github_ssh_id=${{ steps.set-ssh.outputs.SSH_AUTH_SOCK}}"
          build-args: |
            SPS_ORG_PAT=${{ secrets.SPS_ORG_PAT }}
            SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }}
            MARCH=${{ inputs.march }}
          push: true
      - run: |
          docker builder prune -f
  build-image-and-save-to-local:
    if: ${{ inputs.build_locally == true }}
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - uses: webfactory/ssh-agent@v0.4.1
        id: set-ssh
        with:
          ssh-private-key: ${{ secrets.SPS_SSH_ID }}
      - uses: docker/setup-buildx-action@v1
        with:
          install: true
      - run: |
          DOCKER_BUILDKIT=1 docker build -f Dockerfile -t local/${{ inputs.image_name }}:${{ inputs.image_tag }} --ssh github_ssh_id=${{ steps.set-ssh.outputs.SSH_AUTH_SOCK}} --build-arg SPS_ORG_PAT=${{ secrets.SPS_ORG_PAT }} --build-arg SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }} --build-arg MARCH=${{ inputs.march }} --load .
          docker builder prune -f

